[project]
name = "qwen-voice-lab-validator"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
  "qwen-asr==0.0.6",
  "speechbrain>=1.0.3,<2",
  "torch==2.6.0",
  "torchaudio==2.6.0",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchaudio = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
