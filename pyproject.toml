[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qwen-voice-lab"
version = "0.1.0"
description = "Local-first web studio for Qwen3-TTS voice design, cloning and comparison."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.116,<1",
  "numpy>=2.0,<3",
  "pydantic-settings>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "rapidfuzz>=3.14,<4",
  "soundfile>=0.13,<1",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
qwen = [
  "llvmlite==0.48.0",
  "numba==0.66.0",
  "qwen-tts==0.1.1",
  "torch==2.6.0",
  "torchaudio==2.6.0",
]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[project.scripts]
qwen-voice-lab = "qwen_voice_lab.app:run"
qvl = "qwen_voice_lab.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/qwen_voice_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchaudio = { index = "pytorch-cu124" }
